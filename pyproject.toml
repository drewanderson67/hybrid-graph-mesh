[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-graph-mesh"
version = "0.1.0"
description = "Virtual hybrid graph layer bridging RDF (SPARQL) and LPG (Cypher) stores with natural-language querying"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rdflib>=7.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
hgm = "hybrid_graph_mesh.cli:main"

[tool.setuptools.packages.find]
include = ["hybrid_graph_mesh*"]

[tool.setuptools.package-data]
hybrid_graph_mesh = ["console.html"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
